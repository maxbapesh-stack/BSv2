<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BitSwap</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --text: #222222;
    --hint: #8e8e93;
    --button: #2481cc;
    --button-text: #ffffff;
    --secondary-bg: #f0f0f3;
    --border: #e2e2e6;
    --green: #2ecc71;
    --red: #e74c3c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 16px 16px calc(100px + env(safe-area-inset-bottom)) 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
  }
  h1 { font-size: 20px; margin: 4px 0 16px; }
  .hint { color: var(--hint); font-size: 13px; margin-bottom: 16px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .tab {
    flex: 1 1 auto; min-width: 88px; text-align: center; padding: 12px 8px; border-radius: 12px;
    background: var(--secondary-bg); font-weight: 600; font-size: 13px; cursor: pointer;
    border: 2px solid transparent; user-select: none;
  }
  .tab.active { background: var(--button); color: var(--button-text); }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 14px; color: var(--hint); margin-bottom: 7px; font-weight: 500; }
  select, input[type=text] {
    width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid var(--border);
    font-size: 16px; background: var(--bg); color: var(--text); min-height: 50px;
  }
  select:focus, input[type=text]:focus { border-color: var(--button); outline: none; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row select { flex: 1; }
  .addBtn {
    flex: 0 0 auto; width: 50px; height: 50px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--secondary-bg); font-size: 24px; font-weight: 700; cursor: pointer; color: var(--button);
  }
  .segmented { display: flex; border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
  .segmented div { flex: 1; text-align: center; padding: 13px 6px; cursor: pointer; font-size: 14px; font-weight: 500; user-select: none; }
  .segmented div.active { background: var(--button); color: var(--button-text); }
  .calc-preview {
    background: var(--secondary-bg); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 16px;
  }
  .calc-preview div { display: flex; justify-content: space-between; padding: 4px 0; }
  .calc-preview .big { font-size: 17px; font-weight: 700; padding-top: 6px; border-top: 1px solid var(--border); margin-top: 4px; }
  .submitBar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)) 16px;
    background: var(--bg); border-top: 1px solid var(--border);
  }
  button.primary {
    width: 100%; padding: 16px; border-radius: 14px; border: none;
    background: var(--button); color: var(--button-text); font-size: 17px; font-weight: 600; cursor: pointer;
  }
  button.primary:disabled { opacity: .5; }
  .section { display: none; }
  .section.active { display: block; }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
    align-items: flex-end; justify-content: center; padding: 0; z-index: 50;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--bg); border-radius: 20px 20px 0 0; padding: 20px; max-width: 480px; width: 100%;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));
  }
  .modal h3 { margin-top: 0; font-size: 18px; }
  .modal .line { display: flex; justify-content: space-between; padding: 8px 0; font-size: 15px; border-bottom: 1px solid var(--border); }
  .modal .actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal .actions button { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; }
  .btn-cancel { background: var(--secondary-bg); color: var(--text); }
  .btn-confirm { background: var(--button); color: var(--button-text); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { padding: 10px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  th { font-size: 12px; color: var(--hint); font-weight: 600; }
  .toast {
    position: fixed; top: calc(16px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    background: var(--green); color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 100; white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  .locked { text-align: center; padding: 60px 20px; color: var(--hint); }
  .balanceCard {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--secondary-bg); border-radius: 14px; padding: 16px; margin-bottom: 10px;
  }
  .balanceCard .name { font-size: 15px; font-weight: 600; }
  .balanceCard .amount { font-size: 18px; font-weight: 700; }
  .balanceCard .amount.neg { color: var(--red); }
  .sectionHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .typeBadge {
    display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;
    background: var(--secondary-bg); color: #333;
  }
  .typeBadge.tb-expense { background: #fff4cc; color: #8a6d00; }
  .typeBadge.tb-loan { background: #fde0de; color: #b3261e; }
  .typeBadge.tb-repayment { background: #ddf5e2; color: #1e7e34; }
  .typeBadge.tb-trade { background: #dbe9fb; color: #1a56b0; }
  .filterBar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .filterBar select, .filterBar input[type=text], .filterBar input[type=date] {
    padding: 10px 12px; min-height: 42px; font-size: 14px;
  }
  .filterRow { display: flex; gap: 8px; }
  .filterRow > * { flex: 1; min-width: 0; }
</style>
</head>
<body>

<div id="lockedScreen" class="locked" style="display:none">
  🔒 Access denied.<br>Please contact the administrator.
</div>

<div id="app" style="display:none">
  <h1>Operations Log</h1>
  <div class="hint" id="whoami"></div>

  <div class="tabs">
    <div class="tab active" data-tab="trade">Trade</div>
    <div class="tab" data-tab="expense">Expense</div>
    <div class="tab" data-tab="loan">Loan</div>
    <div class="tab" data-tab="repayment">Repayment</div>
    <div class="tab" data-tab="balances">Balances</div>
    <div class="tab" data-tab="history">History</div>
    <div class="tab" data-tab="clients">Clients</div>
  </div>

  <!-- ===== TRADE ===== -->
  <div class="section" id="section-trade">
    <div class="field">
      <label>Outgoing</label>
      <select id="trade-from"></select>
    </div>
    <div class="field">
      <label>Incoming</label>
      <select id="trade-to"></select>
    </div>
    <div class="field">
      <label>Outgoing amount</label>
      <input type="text" inputmode="decimal" id="trade-sumfrom" placeholder="1234.56">
    </div>
    <div class="field">
      <label>Calculate by:</label>
      <div class="segmented">
        <div class="active" data-method="rate">Rate</div>
        <div data-method="fee">Fee</div>
      </div>
      <input type="text" inputmode="decimal" id="trade-value" placeholder="e.g. 1.01">
    </div>
    <div class="field">
      <label>Fee wallet</label>
      <select id="trade-feewallet"></select>
    </div>
    <div class="calc-preview">
      <div><span>Rate</span><span id="calc-rate">—</span></div>
      <div><span>Fee</span><span id="calc-fee">—</span></div>
    </div>
    <div class="field">
      <label>Comment (optional)</label>
      <input type="text" id="trade-comment">
    </div>
  </div>

  <!-- ===== EXPENSE ===== -->
  <div class="section" id="section-expense">
    <div class="field">
      <label>From</label>
      <select id="expense-from"></select>
    </div>
    <div class="field">
      <label>Purpose</label>
      <select id="expense-purpose"></select>
    </div>
    <div class="field">
      <label>Sum</label>
      <input type="text" inputmode="decimal" id="expense-sum" placeholder="1234.56">
    </div>
    <div class="field">
      <label>Comment (optional)</label>
      <input type="text" id="expense-comment">
    </div>
  </div>

  <!-- ===== LOAN ===== -->
  <div class="section" id="section-loan">
    <div class="field">
      <label>Client</label>
      <div class="row">
        <input type="text" id="loan-client" list="clients-datalist" placeholder="Type to search...">
        <button class="addBtn" data-add="client" data-target="loan-client">+</button>
      </div>
    </div>
    <div class="field">
      <label>From</label>
      <select id="loan-from"></select>
    </div>
    <div class="field">
      <label>Sum</label>
      <input type="text" inputmode="decimal" id="loan-sum" placeholder="1234.56">
    </div>
    <div class="field">
      <label>Comment (optional)</label>
      <input type="text" id="loan-comment">
    </div>
  </div>

  <!-- ===== REPAYMENT ===== -->
  <div class="section" id="section-repayment">
    <div class="field">
      <label>Client</label>
      <div class="row">
        <input type="text" id="repayment-client" list="clients-datalist" placeholder="Type to search...">
        <button class="addBtn" data-add="client" data-target="repayment-client">+</button>
      </div>
    </div>
    <div class="field">
      <label>To</label>
      <select id="repayment-to"></select>
    </div>
    <div class="field">
      <label>Sum</label>
      <input type="text" inputmode="decimal" id="repayment-sum" placeholder="1234.56">
    </div>
    <div class="field">
      <label>Comment (optional)</label>
      <input type="text" id="repayment-comment">
    </div>
  </div>

  <!-- ===== BALANCES ===== -->
  <div class="section" id="section-balances">
    <div class="hint">Your wallets</div>
    <div id="balancesList"><div class="hint">Loading...</div></div>
  </div>

  <!-- ===== HISTORY (all operations) ===== -->
  <div class="section" id="section-history">
    <div class="filterBar">
      <input type="text" id="history-search" placeholder="Search details / comment...">
      <div class="filterRow">
        <select id="history-filter-type">
          <option value="">All types</option>
          <option value="TRADE">Trade</option>
          <option value="EXPENSE">Expense</option>
          <option value="LOAN">Loan</option>
          <option value="REPAYMENT">Repayment</option>
        </select>
        <select id="history-filter-operator">
          <option value="">All operators</option>
        </select>
      </div>
      <input type="date" id="history-filter-date">
    </div>
    <div id="historyOutput"><div class="hint">Loading...</div></div>
  </div>

  <!-- ===== CLIENTS (debts) ===== -->
  <div class="section" id="section-clients">
    <div class="field">
      <label>Report</label>
      <div class="segmented" id="clients-report-type">
        <div class="active" data-report="monitoring">Debts monitoring</div>
        <div data-report="history">Debts history</div>
      </div>
    </div>
    <div class="field">
      <label>Scope</label>
      <div class="segmented" id="clients-report-scope">
        <div class="active" data-scope="one">One client</div>
        <div data-scope="all">All clients</div>
      </div>
    </div>
    <div class="field" id="clients-select-wrap">
      <label>Client</label>
      <input type="text" id="clients-select" list="clients-datalist" placeholder="Type to search...">
    </div>
    <button class="primary" id="btnRunReport" style="margin-bottom:16px;">Show</button>
    <div id="reportOutput"></div>
  </div>
</div>

<datalist id="clients-datalist"></datalist>

<div class="submitBar" id="submitBar" style="display:none">
  <button class="primary" id="btnSubmit">Review & submit</button>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Confirm entry</h3>
    <div id="modalLines"></div>
    <div class="actions">
      <button class="btn-cancel" id="btnCancel">Edit</button>
      <button class="btn-confirm" id="btnConfirm">Submit</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* !!! PASTE YOUR APPS SCRIPT WEB APP URL HERE (ends with /exec) !!! */
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzlE7dSzp5GnwSaoXL7_ojB57_STeuRVT9Ya1mUZrF8k07pdOXjNxmi2uUZDYlblqg/exec';

var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
var initData = tg ? tg.initData : '';

var currentTab = 'trade';
var refData = { wallets: [], purposes: [], clients: [] };
var operatorName = '';
var loadedTabs = {};

function callApi(action, payload) {
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, initData: initData, payload: payload || {} })
  })
  .then(function (r) { return r.json(); })
  .then(function (res) {
    if (!res.ok) throw new Error(res.error || 'Unknown server error');
    return res.data;
  });
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 2200);
}

function fillSelect(id, values, keepValue, withPlaceholder) {
  var sel = document.getElementById(id);
  var prev = keepValue || sel.value;
  sel.innerHTML = '';
  if (withPlaceholder) {
    var ph = document.createElement('option');
    ph.value = ''; ph.textContent = '— Select —';
    sel.appendChild(ph);
  }
  values.forEach(function (v) {
    var opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
  if (prev && values.indexOf(prev) !== -1) sel.value = prev;
  else if (withPlaceholder) sel.value = '';
}

function fillDatalist(id, values) {
  var dl = document.getElementById(id);
  dl.innerHTML = '';
  values.forEach(function (v) {
    var opt = document.createElement('option');
    opt.value = v;
    dl.appendChild(opt);
  });
}

function refreshDropdowns() {
  ['trade-from', 'trade-to', 'trade-feewallet', 'expense-from', 'loan-from', 'repayment-to'].forEach(function (id) {
    fillSelect(id, refData.wallets, null, true);
  });
  fillSelect('expense-purpose', refData.purposes);
  fillDatalist('clients-datalist', refData.clients);
}

function loadRefData() {
  return Promise.all([
    callApi('getWallets'),
    callApi('getPurposes'),
    callApi('getClients')
  ]).then(function (res) {
    refData.wallets = res[0]; refData.purposes = res[1]; refData.clients = res[2];
    refreshDropdowns();
  }).catch(function (err) { alert('Failed to load reference lists: ' + err.message); });
}

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(function (tab) {
  tab.addEventListener('click', function () {
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    document.querySelectorAll('.section').forEach(function (s) { s.classList.remove('active'); });
    document.getElementById('section-' + currentTab).classList.add('active');
    var noSubmit = (currentTab === 'clients' || currentTab === 'balances' || currentTab === 'history');
    document.getElementById('submitBar').style.display = noSubmit ? 'none' : 'block';

    if (currentTab === 'balances') loadBalances();
    if (currentTab === 'history' && !loadedTabs.history) { loadedTabs.history = true; loadHistory(); }
  });
});

/* ---------- add new dropdown values ---------- */
document.querySelectorAll('.addBtn[data-add]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var kind = btn.dataset.add;
    var target = btn.dataset.target;
    var name = prompt('New value:');
    if (!name || !name.trim()) return;
    var fnMap = { client: 'addClient' };
    callApi(fnMap[kind], { name: name.trim() }).then(function (list) {
      if (kind === 'client') refData.clients = list;
      refreshDropdowns();
      if (target) document.getElementById(target).value = name.trim();
      showToast('Added: ' + name.trim());
    }).catch(function (err) { alert('Error: ' + err.message); });
  });
});

/* ---------- Trade: Rate/Fee toggle + live recalculation ---------- */
var tradeMethod = 'rate';
document.querySelectorAll('#section-trade .segmented div').forEach(function (el) {
  el.addEventListener('click', function () {
    document.querySelectorAll('#section-trade .segmented div').forEach(function (d) { d.classList.remove('active'); });
    el.classList.add('active');
    tradeMethod = el.dataset.method;
    document.getElementById('trade-value').placeholder = tradeMethod === 'rate' ? 'e.g. 1.01' : 'e.g. 50';
    recalcTrade();
  });
});
document.getElementById('trade-sumfrom').addEventListener('input', recalcTrade);
document.getElementById('trade-value').addEventListener('input', recalcTrade);

/* Fee wallet defaults to whatever "To" is set to, until the user picks a different one manually. */
var feeWalletTouched = false;
document.getElementById('trade-to').addEventListener('change', function () {
  if (!feeWalletTouched) {
    document.getElementById('trade-feewallet').value = document.getElementById('trade-to').value;
  }
});
document.getElementById('trade-feewallet').addEventListener('change', function () {
  feeWalletTouched = true;
});

function parseLocal(s) {
  s = String(s || '').trim().replace(/\s/g, '');
  if (!s) return NaN;
  if (s.indexOf(',') !== -1 && s.indexOf('.') !== -1) s = s.replace(/\./g, '').replace(',', '.');
  else if (s.indexOf(',') !== -1) s = s.replace(',', '.');
  return parseFloat(s);
}
function fmt(n) {
  if (isNaN(n) || n === null || n === undefined) return '—';
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDate(d) {
  var dt = new Date(d);
  var dd = String(dt.getDate()).padStart(2, '0');
  var mm = String(dt.getMonth() + 1).padStart(2, '0');
  var yy = String(dt.getFullYear()).slice(-2);
  return dd + '.' + mm + '.' + yy;
}
function fmtRate(n) {
  if (isNaN(n) || n === null || n === undefined) return '—';
  return Number(n).toLocaleString('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
}
var lastCalc = {};
function recalcTrade() {
  var sumFrom = parseLocal(document.getElementById('trade-sumfrom').value);
  var value = parseLocal(document.getElementById('trade-value').value);
  var rate, fee;
  if (isNaN(sumFrom) || isNaN(value) || sumFrom === 0) {
    document.getElementById('calc-rate').textContent = '—';
    document.getElementById('calc-fee').textContent = '—';
    lastCalc = {};
    return;
  }
  if (tradeMethod === 'rate') { rate = value; fee = sumFrom * rate - sumFrom; }
  else { fee = value; rate = (sumFrom + fee) / sumFrom; }
  document.getElementById('calc-rate').textContent = fmtRate(rate);
  document.getElementById('calc-fee').textContent = fmt(fee);
  lastCalc = { rate: rate, fee: fee };
}

function val(id) { return document.getElementById(id).value; }

function collectPayload() {
  if (currentTab === 'trade') {
    return {
      type: 'trade',
      outgoing: val('trade-from'), incoming: val('trade-to'), outgoingAmount: val('trade-sumfrom'),
      method: tradeMethod, value: val('trade-value'), feeWallet: val('trade-feewallet'),
      comment: val('trade-comment')
    };
  }
  if (currentTab === 'expense') {
    return {
      type: 'expense',
      from: val('expense-from'), purpose: val('expense-purpose'),
      sum: val('expense-sum'), comment: val('expense-comment')
    };
  }
  if (currentTab === 'loan') {
    return {
      type: 'loan',
      client: val('loan-client'), from: val('loan-from'),
      sum: val('loan-sum'), comment: val('loan-comment')
    };
  }
  if (currentTab === 'repayment') {
    return {
      type: 'repayment',
      client: val('repayment-client'), to: val('repayment-to'),
      sum: val('repayment-sum'), comment: val('repayment-comment')
    };
  }
}

var fieldLabels = {
  from: 'From', to: 'To', sum: 'Sum', outgoing: 'Outgoing', incoming: 'Incoming',
  outgoingAmount: 'Outgoing amount', purpose: 'Purpose', client: 'Client',
  method: 'Method', value: 'Value', feeWallet: 'Fee wallet', comment: 'Comment'
};

var requiredFields = {
  trade: ['outgoing', 'incoming', 'outgoingAmount', 'value', 'feeWallet'],
  expense: ['from', 'purpose', 'sum'],
  loan: ['client', 'from', 'sum'],
  repayment: ['client', 'to', 'sum']
};

document.getElementById('btnSubmit').addEventListener('click', function () {
  var payload = collectPayload();
  var missing = (requiredFields[payload.type] || []).filter(function (k) { return !payload[k]; });
  if (missing.length) {
    alert('Please fill in: ' + missing.map(function (k) { return fieldLabels[k] || k; }).join(', '));
    return;
  }
  if ((payload.type === 'loan' || payload.type === 'repayment') && refData.clients.indexOf(payload.client) === -1) {
    if (!confirm('"' + payload.client + '" is not in your client list yet. Add them as a new client and continue?')) return;
    callApi('addClient', { name: payload.client }).then(function (list) {
      refData.clients = list;
      fillDatalist('clients-datalist', list);
      openConfirmModal(payload);
    }).catch(function (err) { alert('Error: ' + err.message); });
    return;
  }
  openConfirmModal(payload);
});

function openConfirmModal(payload) {
  var modal = document.getElementById('modalLines');
  modal.innerHTML = '';
  Object.keys(payload).forEach(function (k) {
    if (k === 'type' || !payload[k]) return;
    var line = document.createElement('div');
    line.className = 'line';
    line.innerHTML = '<span>' + (fieldLabels[k] || k) + '</span><span>' + payload[k] + '</span>';
    modal.appendChild(line);
  });
  if (payload.type === 'trade' && lastCalc.fee !== undefined) {
    var line = document.createElement('div');
    line.className = 'line';
    line.innerHTML = '<span>Fee (calculated)</span><span>' + fmt(lastCalc.fee) + '</span>';
    modal.appendChild(line);
  }
  document.getElementById('overlay').classList.add('show');
  document.getElementById('overlay').dataset.payload = JSON.stringify(payload);
}

document.getElementById('btnCancel').addEventListener('click', function () {
  document.getElementById('overlay').classList.remove('show');
});

document.getElementById('btnConfirm').addEventListener('click', function () {
  var payload = JSON.parse(document.getElementById('overlay').dataset.payload);
  var btn = document.getElementById('btnConfirm');
  btn.disabled = true; btn.textContent = 'Submitting...';
  var fnMap = { trade: 'submitTrade', expense: 'submitExpense', loan: 'submitLoan', repayment: 'submitRepayment' };
  callApi(fnMap[payload.type], payload).then(function () {
    document.getElementById('overlay').classList.remove('show');
    btn.disabled = false; btn.textContent = 'Submit';
    showToast('Saved ✓');
    resetForm(payload.type);
    loadedTabs.history = false;
  }).catch(function (err) {
    btn.disabled = false; btn.textContent = 'Submit';
    alert('Error: ' + err.message);
  });
});

function resetForm(type) {
  document.querySelectorAll('#section-' + type + ' input[type=text]').forEach(function (i) { i.value = ''; });
  document.querySelectorAll('#section-' + type + ' select').forEach(function (s) {
    if (s.id === 'expense-purpose') return;
    s.value = '';
  });
  if (type === 'trade') {
    feeWalletTouched = false;
    recalcTrade();
  }
}

/* ---------- Balances ---------- */
function loadBalances() {
  var out = document.getElementById('balancesList');
  out.innerHTML = '<div class="hint">Loading...</div>';
  callApi('getWalletBalances').then(function (rows) {
    if (!rows.length) { out.innerHTML = '<div class="hint">No wallets yet — add one in the Wallets sheet</div>'; return; }
    out.innerHTML = rows.map(function (r) {
      var neg = r.balance < 0 ? ' neg' : '';
      return '<div class="balanceCard"><div class="name">' + r.wallet + '</div><div class="amount' + neg + '">' + fmt(r.balance) + '</div></div>';
    }).join('');
  }).catch(function (err) { out.innerHTML = 'Error: ' + err.message; });
}

/* ---------- History (all operations) ---------- */
var typeLabels = { TRADE: 'Trade', EXPENSE: 'Expense', LOAN: 'Loan', REPAYMENT: 'Repay' };
var typeBadgeClass = { TRADE: 'tb-trade', EXPENSE: 'tb-expense', LOAN: 'tb-loan', REPAYMENT: 'tb-repayment' };
var allOperations = [];

function loadHistory() {
  var out = document.getElementById('historyOutput');
  out.innerHTML = '<div class="hint">Loading...</div>';
  callApi('getAllOperations').then(function (rows) {
    allOperations = rows;
    var operators = Array.from(new Set(rows.map(function (r) { return r.Operator; }))).filter(Boolean);
    var opSel = document.getElementById('history-filter-operator');
    var prevOp = opSel.value;
    opSel.innerHTML = '<option value="">All operators</option>' +
      operators.map(function (o) { return '<option value="' + o + '">' + o + '</option>'; }).join('');
    if (operators.indexOf(prevOp) !== -1) opSel.value = prevOp;
    renderHistoryTable();
  }).catch(function (err) { out.innerHTML = 'Error: ' + err.message; });
}

function renderHistoryTable() {
  var out = document.getElementById('historyOutput');
  var typeFilter = document.getElementById('history-filter-type').value;
  var opFilter = document.getElementById('history-filter-operator').value;
  var dateFilter = document.getElementById('history-filter-date').value;
  var search = document.getElementById('history-search').value.trim().toLowerCase();

  var rows = allOperations.filter(function (r) {
    if (typeFilter && r.Type !== typeFilter) return false;
    if (opFilter && r.Operator !== opFilter) return false;
    if (dateFilter) {
      var d = new Date(r.Timestamp);
      var iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      if (iso !== dateFilter) return false;
    }
    if (search) {
      var haystack = (r.Details + ' ' + (r.Comment || '') + ' ' + r.Operator).toLowerCase();
      if (haystack.indexOf(search) === -1) return false;
    }
    return true;
  });

  if (!rows.length) { out.innerHTML = '<div class="hint">No operations match these filters</div>'; return; }
  var html = '<table><tr><th>Date</th><th>Type</th><th>Operator</th><th>Details</th><th>Sum</th></tr>';
  rows.forEach(function (r) {
    html += '<tr><td>' + fmtDate(r.Timestamp) + '</td>' +
      '<td><span class="typeBadge ' + (typeBadgeClass[r.Type] || '') + '">' + (typeLabels[r.Type] || r.Type) + '</span></td>' +
      '<td>' + r.Operator + '</td>' +
      '<td>' + r.Details + (r.Extra ? '<br><span class="hint">' + r.Extra + '</span>' : '') + (r.Comment ? '<br><span class="hint">' + r.Comment + '</span>' : '') + '</td>' +
      '<td>' + fmt(Number(r.Sum)) + '</td></tr>';
  });
  html += '</table>';
  out.innerHTML = html;
}

['history-filter-type', 'history-filter-operator', 'history-filter-date'].forEach(function (id) {
  document.getElementById(id).addEventListener('change', renderHistoryTable);
});
document.getElementById('history-search').addEventListener('input', renderHistoryTable);

/* ---------- Clients reports ---------- */
document.querySelectorAll('#clients-report-scope div').forEach(function (el) {
  el.addEventListener('click', function () {
    document.querySelectorAll('#clients-report-scope div').forEach(function (d) { d.classList.remove('active'); });
    el.classList.add('active');
    document.getElementById('clients-select-wrap').style.display = el.dataset.scope === 'one' ? 'block' : 'none';
  });
});
document.querySelectorAll('#clients-report-type div').forEach(function (el) {
  el.addEventListener('click', function () {
    document.querySelectorAll('#clients-report-type div').forEach(function (d) { d.classList.remove('active'); });
    el.classList.add('active');
  });
});

document.getElementById('btnRunReport').addEventListener('click', function () {
  var reportType = document.querySelector('#clients-report-type .active').dataset.report;
  var scope = document.querySelector('#clients-report-scope .active').dataset.scope;
  var client = document.getElementById('clients-select').value;
  var out = document.getElementById('reportOutput');
  out.innerHTML = 'Loading...';

  var call;
  if (reportType === 'monitoring') {
    call = (scope === 'all') ? callApi('getAllBalances') : callApi('getClientBalance', { client: client });
  } else {
    call = (scope === 'all') ? callApi('getAllHistory') : callApi('getClientHistory', { client: client });
  }
  call.then(function (data) {
    if (reportType === 'monitoring') renderBalances(scope === 'all' ? data : [data]);
    else renderHistory(data);
  }).catch(function (err) { out.innerHTML = 'Error: ' + err.message; });
});

function renderBalances(rows) {
  var out = document.getElementById('reportOutput');
  if (!rows.length) { out.innerHTML = '<div class="hint">No data</div>'; return; }
  var html = '<table><tr><th>Client</th><th>Balance</th></tr>';
  rows.forEach(function (r) {
    html += '<tr><td>' + r.client + '</td><td>' + fmt(r.balance) + '</td></tr>';
  });
  html += '</table>';
  out.innerHTML = html;
}
function renderHistory(rows) {
  var out = document.getElementById('reportOutput');
  if (!rows.length) { out.innerHTML = '<div class="hint">No data</div>'; return; }
  var html = '<table><tr><th>Date</th><th>Client</th><th>Type</th><th>Operator</th><th>Sum</th></tr>';
  rows.forEach(function (r) {
    html += '<tr><td>' + fmtDate(r.Timestamp) + '</td><td>' + r.Client + '</td><td>' + r.type + '</td><td>' + r.Operator + '</td><td>' + fmt(Number(r.Sum)) + '</td></tr>';
  });
  html += '</table>';
  out.innerHTML = html;
}

/* ---------- startup: access check ---------- */
callApi('identifyOperator').then(function (op) {
  if (!op) {
    document.getElementById('lockedScreen').style.display = 'block';
    return;
  }
  operatorName = op.name;
  document.getElementById('whoami').textContent = 'Signed in as: ' + operatorName;
  document.getElementById('app').style.display = 'block';
  document.getElementById('submitBar').style.display = 'block';
  loadRefData();
}).catch(function () {
  document.getElementById('lockedScreen').style.display = 'block';
});
</script>
